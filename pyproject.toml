[project]
name = "url-shortener"
version = "0.1.0"
description = "URL shortener built with FastAPI and hosted on Cloudflare Containers."
readme = "README.md"
authors = [
    { name = "Edward Simpson-Fitzgibbon", email = "edward.psf@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.8",
    "mypy>=2.4.1",
    "pydantic-settings>=2.11.0",
    "uvicorn[standard]>=0.39.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: style errors and warnings
    "F",        # pyflakes: unused imports, undefined names
    "I",        # isort: import ordering
    "B",        # bugbear: likely bugs (mutable defaults, etc.)
    "UP",       # pyupgrade: modern syntax for your Python version
    "ASYNC",    # async pitfalls (blocking calls inside async def)
    "S",        # bandit: security checks
    "SIM",      # simplification
    "RUF",      # ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = [
    "url_shortener.core.*",
    "url_shortener.schemas.*",
    "url_shortener.services.*",
    "url_shortener.repos.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
implicit_reexport = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
